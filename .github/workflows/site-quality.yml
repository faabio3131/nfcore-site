name: NFCore Site Quality
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate GitHub Pages routes, accessibility and business copy
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript syntax
        run: node --check assets/site.js
